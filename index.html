<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>QR Code Generator</title>
  <meta name="description" content="Generate static QR codes for links, text, Wi-Fi, contacts and more. Runs entirely in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2317171a'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23fff'/%3E%3Crect x='9' y='3' width='4' height='4' fill='%23fff'/%3E%3Crect x='3' y='9' width='4' height='4' fill='%23fff'/%3E%3Crect x='10' y='10' width='2' height='2' fill='%23e8501c'/%3E%3C/svg%3E">
  <!-- Apply saved theme before first paint to avoid a flash of the wrong theme. -->
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("qrgen:v1") || "{}");
      if (saved.theme === "light" || saved.theme === "dark") {
        document.documentElement.setAttribute("data-theme", saved.theme);
      }
    } catch (e) { /* storage unavailable: fall back to system theme */ }
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#compose" data-i18n="skipToContent">Skip to content</a>

  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 16 16" aria-hidden="true">
        <rect width="16" height="16" rx="3" />
        <rect x="3" y="3" width="4" height="4" class="brand-mark-cut" />
        <rect x="9" y="3" width="4" height="4" class="brand-mark-cut" />
        <rect x="3" y="9" width="4" height="4" class="brand-mark-cut" />
        <rect x="10" y="10" width="2" height="2" class="brand-mark-accent" />
      </svg>
      <span class="brand-name">qrcode</span>
    </div>

    <nav class="header-actions" data-i18n-attr="aria-label:headerActions">
      <button type="button" class="icon-btn" id="theme-toggle" data-i18n-attr="aria-label:toggleTheme;title:toggleTheme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
      <button type="button" class="icon-btn lang-btn" id="lang-toggle" data-i18n-attr="aria-label:switchLanguage;title:switchLanguage">
        <span class="lang-code" id="lang-code">EN</span>
      </button>
      <a class="icon-btn" href="https://github.com/gustavo-alberto/qrcode-generator" target="_blank" rel="noopener noreferrer" data-i18n-attr="aria-label:sourceCode;title:sourceCode">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 6l-6 6 6 6M16 6l6 6-6 6" />
        </svg>
      </a>
    </nav>
  </header>

  <main class="workspace">
    <!-- Left column: what the user edits. -->
    <div class="compose" id="compose">
      <section class="block" aria-labelledby="content-title">
        <h2 class="block-title" id="content-title">
          <span class="block-index">01</span>
          <span data-i18n="contentTitle">Content</span>
        </h2>
        <div class="block-body" id="content-body">
          <label class="field-label" for="content-input" data-i18n="contentLabel">Link or text</label>
          <textarea class="field textarea" id="content-input" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-attr="placeholder:contentPlaceholder" aria-describedby="content-hint"></textarea>
          <p class="field-hint" id="content-hint" data-i18n="contentHint">The QR code updates as you type.</p>
        </div>
      </section>

      <section class="block" aria-labelledby="appearance-title">
        <h2 class="block-title" id="appearance-title">
          <span class="block-index">02</span>
          <span data-i18n="appearanceTitle">Appearance</span>
        </h2>
        <div class="block-body placeholder" id="appearance-body">
          <p data-i18n="comingSoon">Coming in a later stage.</p>
        </div>
      </section>
    </div>

    <!-- Right column: the result and its export. Sticky on large screens. -->
    <aside class="stage" aria-labelledby="preview-title">
      <h2 class="visually-hidden" id="preview-title" data-i18n="previewTitle">Preview</h2>

      <div class="qr-card">
        <span class="crop crop-tl" aria-hidden="true"></span>
        <span class="crop crop-tr" aria-hidden="true"></span>
        <span class="crop crop-bl" aria-hidden="true"></span>
        <span class="crop crop-br" aria-hidden="true"></span>
        <div class="qr-canvas is-empty" id="qr-canvas" role="img" aria-label="Empty QR code preview">
          <div class="qr-ghost" aria-hidden="true">
            <span class="ghost-finder ghost-tl"></span>
            <span class="ghost-finder ghost-tr"></span>
            <span class="ghost-finder ghost-bl"></span>
          </div>
        </div>
      </div>

      <p class="status" id="status" data-status="empty" aria-live="polite">
        <span class="status-icon" aria-hidden="true"></span>
        <span id="status-text">Your QR code will appear here</span>
      </p>

      <section class="block export-block" aria-labelledby="export-title">
        <h2 class="block-title" id="export-title">
          <span class="block-index">03</span>
          <span data-i18n="exportTitle">Export</span>
        </h2>
        <div class="block-body placeholder" id="export-body">
          <p data-i18n="comingSoon">Coming in a later stage.</p>
        </div>
      </section>
    </aside>
  </main>

  <footer class="app-footer">
    <span data-i18n="footerLicense">Open source (MIT)</span>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/gustavo-alberto/qrcode-generator" target="_blank" rel="noopener noreferrer">GitHub</a>
  </footer>

  <!-- Mobile-only action bar, inside the thumb zone. -->
  <div class="action-bar" id="action-bar">
    <button type="button" class="btn btn-primary" disabled data-i18n="download">Download</button>
    <button type="button" class="btn btn-secondary" disabled data-i18n="copy">Copy</button>
  </div>

  <script src="vendor/qr-code-styling.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="js/state.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
